replicaCount: 1
image:
  repository: redis
  tag: "latest"
  pullPolicy: IfNotPresent

containerPort: 6379

service:
  type: ClusterIP
  port: 6379



env:
  - name: APP_ENV
    value: production
  - name: LOG_LEVEL
    value: info

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi